name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: petopia_app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: petopia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U petopia_app -d petopia_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace apps/api
        env:
          DATABASE_URL: 'postgresql://petopia_app:password@localhost:5432/petopia_test?schema=public'

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace apps/api
        env:
          DATABASE_URL: 'postgresql://petopia_app:password@localhost:5432/petopia_test?schema=public'

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy --workspace apps/api
        env:
          DATABASE_URL: 'postgresql://petopia_app:password@localhost:5432/petopia_test?schema=public'

      - name: Run lint
        run: npm run lint

      - name: Run API unit tests
        run: npm test

      - name: Run API end-to-end tests
        run: npm run test:e2e
        env:
          DATABASE_URL: 'postgresql://petopia_app:password@localhost:5432/petopia_test?schema=public'

      - name: Build web and API
        run: npm run build
